<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KW North Training</title>
  <meta name="theme-color" content="#111827" />
  <style>
    :root{--red:#d32f2f;--red-dark:#b71c1c;--black:#111827;--muted:#6b7280;--line:#e5e7eb;--bg:#f8fafc;--white:#fff;--shadow:0 14px 34px rgba(15,23,42,.08)}
    *{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#fff,var(--bg));color:var(--black);line-height:1.5}a{text-decoration:none;color:inherit}.container{width:min(980px,100%);margin:auto;padding:0 20px}
    .topbar{background:#111827;color:#fff}.topbar-inner{min-height:76px;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{display:flex;align-items:center;gap:12px}.brand-badge{width:46px;height:46px;border-radius:14px;background:var(--red);display:grid;place-items:center;font-weight:900}.brand strong{display:block}.brand span{font-size:12px;color:#cbd5e1}.back{border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:10px 13px;font-weight:800}
    main{padding:34px 0 64px}.eyebrow{display:inline-flex;padding:7px 11px;border-radius:999px;background:#fff1f2;color:#991b1b;border:1px solid #fecaca;font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.hero{margin-bottom:24px}.hero h1{font-size:38px;line-height:1.1;margin:12px 0 8px}.hero p{margin:0;color:var(--muted);max-width:720px}.video-list{display:grid;gap:14px}.video{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:space-between;gap:18px}.video strong{display:block;font-size:17px}.video span{display:block;color:var(--muted);font-size:13px;margin-top:4px}.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--red);color:#fff;font-weight:900;cursor:pointer;white-space:nowrap}.btn:hover{background:var(--red-dark)}.empty{background:#fff;border:1px solid var(--line);border-radius:18px;padding:30px;text-align:center;color:var(--muted)}
    .overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.78);z-index:20;align-items:center;justify-content:center;padding:18px}.overlay.show{display:flex}.identify-card{width:min(500px,100%);background:#fff;border-radius:22px;padding:26px}.identify-card h2{margin:10px 0}.identify-card p{color:var(--muted)}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:900;margin-bottom:5px}.field input{width:100%;height:46px;border:1px solid #d1d5db;border-radius:11px;padding:0 12px;font-size:15px}.error{display:none;background:#fee2e2;color:#991b1b;border-radius:10px;padding:9px 11px;font-size:13px;margin-bottom:10px}.agent-chip{font-size:12px;color:#cbd5e1}.agent-chip strong{color:#fff}
    @media(max-width:650px){.topbar-inner{align-items:flex-start;flex-direction:column;padding:12px 0}.hero h1{font-size:30px}.video{align-items:stretch;flex-direction:column}.btn{width:100%}}
  </style>
</head>
<body>
  <header class="topbar"><div class="container topbar-inner"><div class="brand"><div class="brand-badge">KW</div><div><strong>KW North Training</strong><span id="sectionLabel">Direct training access</span></div></div><div style="display:flex;align-items:center;gap:12px"><div class="agent-chip" id="agentChip"></div><a class="back" href="hub.html">Training Hub</a></div></div></header>
  <main><div class="container"><section class="hero"><div class="eyebrow" id="badge">Training</div><h1 id="title">Training</h1><p id="description"></p></section><section class="video-list" id="videoList"></section></div></main>
  <div class="overlay" id="identifyOverlay"><form class="identify-card" id="identifyForm"><div class="eyebrow">KW North Training Hub</div><h2>Who is training today?</h2><p>Enter your Name and Surname so your training activity stays under one profile.</p><div class="error" id="identifyError"></div><div class="field"><label>Name</label><input id="firstName" autocomplete="given-name" required></div><div class="field"><label>Surname</label><input id="lastName" autocomplete="family-name" required></div><button class="btn" type="submit" style="width:100%">Continue to Training</button></form></div>
  <script>
    const API_URL='https://fdbsqjtwbucjhjgphhyh.supabase.co/functions/v1/training-api';
    const PUBLISHABLE_KEY='sb_publishable_GmMPNJ5JAKMh8j9Mk1nmpg_3fs17xqG';
    const TOKEN_KEY='kwNorthTrainingToken',NAME_KEY='kwNorthTrainingName';
    let token=localStorage.getItem(TOKEN_KEY)||'',profileName=localStorage.getItem(NAME_KEY)||'';
    const sections={
      command:{title:'KW Command Training',badge:'Tech',description:'Contacts, tasks, SmartPlans and practical Command workflows.',videos:[
        ['Adding Contacts onto your Command using your Phone','Mobile contact importing and setup training.','https://drive.google.com/file/d/1_e7o19kOOs7kwGL-Dn5fJwHZuvuLbnpR/preview','adding-contacts-phone'],
        ['How to action out Task using Command on your smart phone','Using Command task workflows on mobile.','https://drive.google.com/file/d/1VrjWF3O1rrfwMUPZI2UrYmbBrQNL3QLc/preview','tasks-smartphone'],
        ['How to Action Your Tasks in Command','Desktop task completion workflow.','https://drive.google.com/file/d/125ahihTtXnJtCzjzwNedC8ROUCx-j7Uz/preview','tasks-desktop'],
        ['How to add Smart Plans and add your contacts','SmartPlan setup and contact assignment.','https://drive.google.com/file/d/13HAzVNAw3ed78tNyZQWMy5meir8XQlRD/preview','smartplans-contacts'],
        ['Birthday Smart Plan training','Birthday SmartPlan setup and usage.','https://drive.google.com/file/d/1KsOgabj4Qx6We4061ZRtR3h6cA3g4_n0/preview','birthday-smartplan']
      ]},
      mapp:{title:'MAPP & Listings',badge:'Listings',description:'MAPP overview, mobile access, listing uploads, Agent Sites, AI tools and marketing workflows.',videos:[
        ['Introduction | MAPP Overview','Introduction to MAPP and a practical overview of the platform.','https://drive.google.com/file/d/1WUM1slaQ0Li1OS5H4h1mUVul44xx5CEm/preview','mapp-overview'],
        ['Mobile Access | AMAPP Mobile Access','Access and use AMAPP from your mobile device.','https://drive.google.com/file/d/11Rf0eqs2TmQHZMK7b7pPVonr4UUGgzav/preview','amapp-mobile-access'],
        ['How to load your listing on MAPP','Updated listing upload process on MAPP.','https://drive.google.com/file/d/1AdWWPPrsMq0qyMTlPwTReC5M2tsff2Nf/preview','load-listing'],
        ['Agent Sites','How to use Agent Sites and work with your property listing links.','https://drive.google.com/file/d/1XAg-_i8JdFLQ7W6dt0sPBMH4JTgLBq6p/preview','agent-sites'],
        ['AI Tools | CMA and Marketing Plan','Use AI tools to support your CMA and marketing plan workflow.','https://drive.google.com/file/d/1pnBCpJ3zCe6rYOfIy8XcnpfyoAJG5tMM/preview','ai-tools-cma-marketing-plan']
      ]},
      loom:{title:'LOOM',badge:'LOOM',description:'Property information, report access and common LOOM troubleshooting.',videos:[
        ['Accessing Contact Info street & Sectional Titles','Contact info, street and sectional title data.','https://drive.google.com/file/d/1PFeB2Ebly1yyRCkXfKCreEy0xGeegu8K/preview','contact-info-sectional'],
        ['Error Pulling LOOM reports','Troubleshooting common LOOM report issues.','https://drive.google.com/file/d/1UG4JwIctEN2ufWc_h9428IO5eKuWkIP-/preview','report-errors']
      ]},
      other:{title:'Other Training',badge:'Support',description:'Additional technical and practical training for common support questions.',videos:[
        ['Clearing browser history and Cache','Browser troubleshooting and cache clearing guide.','https://drive.google.com/file/d/1ADA8DhhDhq-E3kZR6CyhmCuxKtg6EV-I/preview','browser-cache']
      ]},
      resources:{title:'Helpful Resources',badge:'Resources',description:'Reference material and additional learning content as it becomes available.',videos:[]}
    };
    const params=new URLSearchParams(location.search);const category=params.get('category')||'command';const section=sections[category]||sections.command;
    title.textContent=section.title;badge.textContent=section.badge;description.textContent=section.description;sectionLabel.textContent=section.title;
    function render(){agentChip.innerHTML=profileName?`Agent: <strong>${profileName}</strong>`:'';videoList.innerHTML=section.videos.length?section.videos.map(v=>`<article class="video"><div><strong>${v[0]}</strong><span>${v[1]}</span></div><button class="btn" onclick="openTrackedResource('${v[2]}','${category}','${v[3]}')">Watch</button></article>`).join(''):'<div class="empty"><strong>Coming soon</strong><br>New resources can be added here as they become available.</div>'}
    async function api(payload){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':PUBLISHABLE_KEY},body:JSON.stringify(payload)});const d=await r.json().catch(()=>({error:'Invalid server response.'}));if(!r.ok)throw Object.assign(new Error(d.error||'Request failed.'),{status:r.status});return d}
    function showIdentify(){identifyOverlay.classList.add('show')}function hideIdentify(){identifyOverlay.classList.remove('show')}
    identifyForm.addEventListener('submit',async e=>{e.preventDefault();identifyError.style.display='none';try{const d=await api({action:'identify',first_name:firstName.value.trim(),last_name:lastName.value.trim()});token=d.token;profileName=`${d.agent.first_name} ${d.agent.last_name}`;localStorage.setItem(TOKEN_KEY,token);localStorage.setItem(NAME_KEY,profileName);hideIdentify();render();await track('category_opened',category,category+'-direct')}catch(x){identifyError.textContent=x.message;identifyError.style.display='block'}});
    async function track(eventType,cat,resourceKey,metadata={}){if(!token)return;try{await api({action:'track',token,event_type:eventType,category:cat,resource_key:resourceKey,metadata})}catch(x){if(x.status===401){token='';profileName='';localStorage.removeItem(TOKEN_KEY);localStorage.removeItem(NAME_KEY);showIdentify()}}}
    function openTrackedResource(url,cat,key){if(!token){showIdentify();return}track('resource_opened',cat,key,{url});window.open(url,'_blank','noopener,noreferrer')}
    async function init(){render();if(!token){showIdentify();return}try{await track('category_opened',category,category+'-direct')}catch{} }
    init();
  </script>
</body>
</html>
